# Merge with compose.yaml; never replace the existing cluster configuration.
services:
  postgres:
    image: postgres:17.6-bookworm
    hostname: postgres
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    environment:
      POSTGRES_DB: trend_detect
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --encoding=UTF8
    secrets: [postgres_password]
    command: [postgres, -c, shared_buffers=64MB, -c, work_mem=4MB, -c, max_connections=30]
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../:/workspace:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d trend_detect"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
volumes:
  postgres-data:
secrets:
  postgres_password:
    file: ../config/secrets/postgres_password.txt
